# CI Pipeline — GitHub Actions
#
# Tec 11 — Pipeline d'intégration continue
#
# Jobs :
#   quality        : lint + typecheck + tests unitaires (+ coverage)
#   build          : build backend + frontend (needs: quality)
#   e2e            : test E2E avec services PostgreSQL + Redis (needs: build)
#   security       : gitleaks + audit des dépendances (parallèle à quality)
#   openapi-check  : vérifie que openapi.json est à jour (needs: quality)
#   api-client     : vérifie que le client Angular généré est à jour (needs: quality)
#   ci-success     : agrégateur (required status check pour la protection de branch)
#
# Règles :
#   - Aucune étape critique en continue-on-error
#   - Cache pnpm activé partout
#   - Versions d'actions épinglées en @v4
#   - Images Docker des services épinglées
#   - Healthchecks obligatoires pour les services E2E

name: CI

on:
  pull_request:
    branches: [main, working]
  push:
    branches: [main, working, 'feature/**', 'review/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1 — quality (lint + types + tests unitaires)
  # ─────────────────────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: |
          pnpm -C backend test --coverage
          pnpm -C frontend test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            backend/coverage
            frontend/coverage
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 2 — build (backend + frontend)
  # ─────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            backend/dist
            frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 3 — e2e (tests end-to-end avec services Postgres + Redis)
  # ─────────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brunyshop_test
          POSTGRES_PASSWORD: brunyshop_test
          POSTGRES_DB: brunyshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://brunyshop_test:brunyshop_test@localhost:5432/brunyshop_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'ci-only-access-secret-at-least-forty-eight-characters-abcdefg' }}
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL: 30d
      APP_PUBLIC_URL: http://localhost:4200
      ADMIN_PUBLIC_URL: http://localhost:4300
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 1000
      CORS_ORIGINS: http://localhost:4200,http://localhost:4300
      # CAPTCHA off for generic e2e. The three captcha-*.e2e-spec.ts files
      # override these values with Cloudflare's public always-pass/fail keys.
      TURNSTILE_ENABLED: 'false'
      STORAGE_PROVIDER: fake
      MAIL_DRIVER: console
      SEED_SUPER_ADMIN_EMAIL: admin@brunyshopping.example
      SEED_SUPER_ADMIN_PASSWORD: ci-test-password-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run Prisma migrate deploy
        run: pnpm prisma:migrate

      - name: Run db:seed
        run: pnpm db:seed

      - name: Run backend e2e tests
        run: |
          set +e
          pnpm -C backend test:e2e 2>&1 | tee /tmp/backend-e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "FAIL |AssertionError|Error:|Test Files|Tests " /tmp/backend-e2e.log | tail -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Install Playwright Chromium
        run: pnpm -C frontend exec playwright install --with-deps chromium

      - name: Run frontend e2e tests
        run: |
          pnpm -C backend dev > /tmp/api.log 2>&1 &
          API_PID=$!
          (cd frontend && exec node node_modules/@angular/cli/bin/ng.js serve storefront --host 127.0.0.1 --port 4200) > /tmp/storefront.log 2>&1 &
          STOREFRONT_PID=$!
          trap 'kill $API_PID $STOREFRONT_PID' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4000/api/v1/health/ready > /dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:4000/api/v1/health/ready > /dev/null || { cat /tmp/api.log; exit 1; }
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:4200/boutique > /dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:4200/boutique > /dev/null || { cat /tmp/storefront.log; exit 1; }
          pnpm -C frontend test:e2e

      - name: Upload e2e reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 4 — security (gitleaks + audit des dépendances)
  # ─────────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # L'action officielle exige une licence depuis 2026 ; le binaire CLI
      # reste gratuit. Version et empreinte SHA-256 épinglées.
      - name: Install Gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Gitleaks
        run: /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  # ─────────────────────────────────────────────────────────────
  # Job 5 — openapi-check (vérifie que openapi.json est à jour)
  # ─────────────────────────────────────────────────────────────
  openapi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brunyshop_test
          POSTGRES_PASSWORD: brunyshop_test
          POSTGRES_DB: brunyshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://brunyshop_test:brunyshop_test@localhost:5432/brunyshop_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'ci-only-access-secret-at-least-forty-eight-characters-abcdefg' }}
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL: 30d
      APP_PUBLIC_URL: http://localhost:4200
      ADMIN_PUBLIC_URL: http://localhost:4300
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 1000
      CORS_ORIGINS: http://localhost:4200,http://localhost:4300
      TURNSTILE_ENABLED: 'false'
      STORAGE_PROVIDER: fake
      MAIL_DRIVER: console
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export OpenAPI spec
        run: pnpm -C backend openapi:export

      - name: Check OpenAPI spec is up to date
        run: git diff --exit-code backend/openapi.json

  # ─────────────────────────────────────────────────────────────
  # Job 6 — api-client (vérifie que le client Angular généré est à jour)
  # ─────────────────────────────────────────────────────────────
  api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate the API client and fail on drift
        run: pnpm api:check

  # ─────────────────────────────────────────────────────────────
  # Job 7 — ci-success (agrégateur)
  # ─────────────────────────────────────────────────────────────
  ci-success:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, build, e2e, security, openapi-check, api-client]
    if: always()
    steps:
      - name: Aggregate job results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          OPENAPI_RESULT: ${{ needs.openapi-check.result }}
          API_CLIENT_RESULT: ${{ needs.api-client.result }}
        run: |
          overall_success=true
          for entry in \
            "quality:$QUALITY_RESULT" \
            "build:$BUILD_RESULT" \
            "e2e:$E2E_RESULT" \
            "security:$SECURITY_RESULT" \
            "openapi-check:$OPENAPI_RESULT" \
            "api-client:$API_CLIENT_RESULT"; do
            job="${entry%%:*}"
            result="${entry#*:}"
            echo "Job '$job' result: $result"
            if [ "$result" != "success" ]; then
              overall_success=false
            fi
          done
          if [ "$overall_success" = true ]; then
            echo "All required jobs passed"
            exit 0
          else
            echo "One or more required jobs failed"
            exit 1
          fi
