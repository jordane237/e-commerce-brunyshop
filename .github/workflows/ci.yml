# CI Pipeline — GitHub Actions
#
# Tec 11 — Pipeline d'intégration continue
#
# Jobs :
#   quality        : lint + typecheck + tests unitaires (+ coverage)
#   build          : build backend + frontend (needs: quality)
#   e2e            : test E2E avec services PostgreSQL + Redis (needs: build)
#   security       : gitleaks + audit des dépendances (parallèle à quality)
#   openapi-check  : vérifie que openapi.json est à jour (needs: quality)
#   api-client     : vérifie que le client Angular généré est à jour (needs: quality)
#   ci-success     : agrégateur (required status check pour la protection de branch)
#
# Règles :
#   - Aucune étape critique en continue-on-error
#   - Cache pnpm activé partout
#   - Versions d'actions épinglées en @v4
#   - Images Docker des services épinglées
#   - Healthchecks obligatoires pour les services E2E

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1 — quality (lint + types + tests unitaires)
  # ─────────────────────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 2 — build (backend + frontend)
  # ─────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            backend/dist
            frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 3 — e2e (tests end-to-end avec services Postgres + Redis)
  # ─────────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brunyshop_test
          POSTGRES_PASSWORD: brunyshop_test
          POSTGRES_DB: brunyshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://brunyshop_test:brunyshop_test@localhost:5432/brunyshop_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'ci-only-access-secret-at-least-forty-eight-characters-abcdefg' }}
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL: 30d
      APP_PUBLIC_URL: http://localhost:4200
      ADMIN_PUBLIC_URL: http://localhost:4300
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 1000
      CORS_ORIGINS: http://localhost:4200,http://localhost:4300
      # CAPTCHA off for generic e2e. The three captcha-*.e2e-spec.ts files
      # override these values with Cloudflare's public always-pass/fail keys.
      TURNSTILE_ENABLED: 'false'
      STORAGE_PROVIDER: fake
      MAIL_DRIVER: console
      SEED_SUPER_ADMIN_EMAIL: admin@brunyshopping.example
      SEED_SUPER_ADMIN_PASSWORD: ci-test-password-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run Prisma migrate deploy
        run: pnpm prisma:migrate

      - name: Run db:seed
        run: pnpm db:seed

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Upload e2e reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 4 — security (gitleaks + audit des dépendances)
  # ─────────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────
  # Job 5 — openapi-check (vérifie que openapi.json est à jour)
  # ─────────────────────────────────────────────────────────────
  openapi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export OpenAPI spec
        run: pnpm -C backend openapi:export

      - name: Check OpenAPI spec is up to date
        run: git diff --exit-code backend/openapi.json

  # ─────────────────────────────────────────────────────────────
  # Job 6 — api-client (vérifie que le client Angular généré est à jour)
  # ─────────────────────────────────────────────────────────────
  api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate the API client and fail on drift
        run: pnpm api:check

  # ─────────────────────────────────────────────────────────────
  # Job 7 — ci-success (agrégateur)
  # ─────────────────────────────────────────────────────────────
  ci-success:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, build, e2e, security, openapi-check, api-client]
    if: always()
    steps:
      - name: Aggregate job results
        run: |
          overall_success=true
          for job in quality build e2e security openapi-check api-client; do
            result="${{ needs.$job.result }}"
            echo "Job '$job' result: $result"
            if [ "$result" != "success" ]; then
              overall_success=false
            fi
          done
          if [ "$overall_success" = true ]; then
            echo "All required jobs passed"
            exit 0
          else
            echo "One or more required jobs failed"
            exit 1
          fi
