name: Docker Image Scan

on:
  push:
    branches: [main, working]
    paths:
      - 'infra/docker/Dockerfile.*'
      - 'docker-compose.prod.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/docker/**'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: docker-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            dockerfile: infra/docker/Dockerfile.api
          - name: storefront
            dockerfile: infra/docker/Dockerfile.storefront
          - name: admin
            dockerfile: infra/docker/Dockerfile.admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build image
        run: docker build -f ${{ matrix.image.dockerfile }} -t brunyshop-${{ matrix.image.name }}:${{ github.sha }} .

      - name: Run Trivy scanner (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'brunyshop-${{ matrix.image.name }}:${{ github.sha }}'
          format: 'table'
          output: 'trivy-${{ matrix.image.name }}.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'brunyshop-${{ matrix.image.name }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.image.name }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Create issue with Trivy results on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const name = '${{ matrix.image.name }}';
            const body = fs.readFileSync(`trivy-${name}.txt`, 'utf8').slice(0, 60000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Trivy CRITICAL/HIGH findings - ${name} (${context.sha.slice(0,7)})`,
              body: '```\n' + body + '\n```',
              labels: ['security', 'trivy']
            });

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.image.name }}.sarif'
          category: 'trivy-${{ matrix.image.name }}'

      - name: Upload Trivy SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.image.name }}-sarif
          path: 'trivy-${{ matrix.image.name }}.sarif'
