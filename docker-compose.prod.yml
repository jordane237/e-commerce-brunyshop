# BRUNY SHOPPING — production stack
#
# Usage:
#   cp .env.production.example .env.production
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --wait
#
# PostgreSQL and Redis are intentionally NOT published on the host (CA #4).
# All application traffic enters through the gateway on port 80.

name: brunyshop-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-security: &default-security
  - no-new-privileges:true

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requis}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: *default-security
    logging: *default-logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD requis}',
      ]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt: *default-security
    logging: *default-logging

  minio:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requis}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - minio_data:/data
    networks:
      - storage
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt: *default-security
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET requis}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL requis}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:?ADMIN_PUBLIC_URL requis}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS requis}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY requis}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY requis}
      TURNSTILE_VERIFY_URL: ${TURNSTILE_VERIFY_URL:-https://challenges.cloudflare.com/turnstile/v0/siteverify}
      TURNSTILE_TIMEOUT_MS: ${TURNSTILE_TIMEOUT_MS:-5000}
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM requis}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST requis}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_MAX_FILE_SIZE_MB: ${STORAGE_MAX_FILE_SIZE_MB:-5}
      STORAGE_PRESIGN_EXPIRES_SECONDS: ${STORAGE_PRESIGN_EXPIRES_SECONDS:-300}
      STORAGE_MAX_IMAGES_PER_PRODUCT: ${STORAGE_MAX_IMAGES_PER_PRODUCT:-10}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET:-brunyshop-media}
      MEDIA_BUCKET: ${MINIO_BUCKET:-brunyshop-media}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
      - edge
      - storage
    expose:
      - '4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: *default-security
    logging: *default-logging

  storefront:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.storefront
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      API_INTERNAL_URL: http://api:4000/api/v1
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL requis}
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    expose:
      - '4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    security_opt: *default-security
    logging: *default-logging

  admin:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    expose:
      - '8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: *default-security
    logging: *default-logging

  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gateway
    restart: unless-stopped
    ports:
      - '80:8080'
    depends_on:
      storefront:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: *default-security
    logging: *default-logging

networks:
  backend:
    internal: true
  storage:
    internal: true
  edge:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
