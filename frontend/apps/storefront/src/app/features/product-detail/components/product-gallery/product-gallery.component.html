<div class="gallery" role="region" aria-label="Galerie photos du produit">
  <div
    class="gallery__main"
    tabindex="0"
    role="group"
    aria-roledescription="Carrousel"
    [attr.aria-label]="'Photo ' + (activeIndex() + 1) + ' sur ' + images().length"
    (keydown)="onKeydown($event)"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
  >
    @if (activeImage(); as image) {
      <!-- La clé par id force NgOptimizedImage à recréer l'élément quand la
           photo active change : sinon le src initial reste mémorisé. -->
      @for (current of [image]; track current.id) {
        <button
          type="button"
          class="gallery__main-button"
          (click)="openZoom.emit()"
          [attr.aria-label]="'Agrandir la photo ' + (activeIndex() + 1)"
        >
          <img
            [ngSrc]="current.url"
            [alt]="current.alt ?? productName()"
            width="800"
            height="800"
            [priority]="activeIndex() === 0"
            class="gallery__main-image"
          />
          <span class="gallery__zoom" aria-hidden="true">
            <bruny-icon name="zoom-in" [size]="18" />
          </span>
        </button>
      }
      <span class="gallery__counter" aria-hidden="true">
        {{ activeIndex() + 1 }}/{{ images().length }}
      </span>
    } @else {
      <bruny-skeleton variant="rect" height="420px" />
    }
  </div>

  @if (images().length > 1) {
    <div class="gallery__thumbnails" role="list" aria-label="Miniatures des photos">
      @for (image of images(); track image.id; let index = $index) {
        <div role="listitem" class="gallery__thumbnail-item">
          <button
            type="button"
            class="gallery__thumbnail"
            [class.gallery__thumbnail--active]="index === activeIndex()"
            (click)="select(index)"
            [attr.aria-label]="'Voir la photo ' + (index + 1) + ' sur ' + images().length"
            [attr.aria-current]="index === activeIndex() ? 'true' : null"
          >
            <img [ngSrc]="image.url" [alt]="image.alt ?? ''" width="80" height="80" />
          </button>
        </div>
      }
    </div>

    <div class="gallery__indicators" role="tablist" aria-label="Navigation photos">
      @for (image of images(); track image.id; let index = $index) {
        <button
          type="button"
          role="tab"
          class="gallery__indicator"
          [class.gallery__indicator--active]="index === activeIndex()"
          [attr.aria-selected]="index === activeIndex()"
          [attr.aria-label]="'Photo ' + (index + 1)"
          (click)="select(index)"
        ></button>
      }
    </div>
  }
</div>
