<section class="empty" role="status" aria-live="polite">
  <span class="empty__icon" aria-hidden="true">
    <svg
      viewBox="0 0 24 24"
      width="40"
      height="40"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
    >
      <circle cx="11" cy="11" r="7" />
      <path d="m16.5 16.5 4 4" />
      <path d="M8.5 11h5" />
    </svg>
  </span>

  <h2 class="empty__title">Aucun résultat</h2>
  <p class="empty__text">Essayez un autre mot-clé ou retirez un filtre.</p>

  <button class="empty__reset" type="button" (click)="reset.emit()">
    Réinitialiser les filtres
  </button>

  @if (suggestions().length > 0) {
    <div class="empty__suggestions">
      <p class="empty__suggestions-title">Découvrir nos catégories</p>
      <ul class="empty__list">
        @for (suggestion of suggestions(); track suggestion.slug) {
          <li>
            <a [routerLink]="['/boutique']" [queryParams]="{ category: suggestion.slug }">
              {{ suggestion.name }}
            </a>
          </li>
        }
      </ul>
    </div>
  }

  <a class="empty__link" [routerLink]="['/boutique']" [queryParams]="{ sort: 'newest' }">
    Voir les nouveautés
  </a>
</section>
