<div class="bs-tabs" role="tablist" [attr.aria-label]="ariaLabel()">
  @for (tab of tabs(); track tab.id; let index = $index) {
    <button
      type="button"
      role="tab"
      class="bs-tabs__tab"
      [id]="tabId(tab)"
      [attr.aria-selected]="isActive(tab)"
      [attr.aria-controls]="panelId(tab)"
      [attr.tabindex]="isActive(tab) ? 0 : -1"
      (click)="select(tab)"
      (keydown)="onKeydown($event, index)"
    >
      {{ tab.label }}
    </button>
  }
</div>
