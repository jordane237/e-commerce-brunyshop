<div class="action-menu">
  <button
    type="button"
    class="action-menu__trigger"
    [attr.aria-label]="label()"
    [attr.aria-haspopup]="'menu'"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <bruny-icon name="more-vertical" [size]="18" aria-hidden="true" />
  </button>
  @if (open()) {
    <div class="action-menu__panel" role="menu" [attr.aria-label]="label()">
      @for (item of items(); track item.label) {
        <button
          type="button"
          class="action-menu__item"
          [class.action-menu__item--danger]="item.danger"
          [disabled]="item.disabled"
          role="menuitem"
          (click)="select(item)"
        >
          @if (item.icon) {
            <bruny-icon [name]="item.icon" [size]="16" aria-hidden="true" />
          }
          <span>{{ item.label }}</span>
        </button>
      }
    </div>
  }
</div>
