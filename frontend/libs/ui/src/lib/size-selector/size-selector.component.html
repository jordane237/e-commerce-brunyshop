<div
  class="bs-size-selector"
  [class.bs-size-selector--readonly]="readonly()"
  [class.bs-size-selector--loading]="loading()"
>
  @if (showLabel()) {
    <button
      type="button"
      class="bs-size-selector__label"
      aria-label="Sélectionner la pointure"
      [attr.aria-busy]="loading() ? 'true' : null"
      [disabled]="readonly() || loading()"
    >
      @if (selected(); as selectedItem) {
        {{ selectedItem.size }}
      } @else {
        Sélectionner
      }
    </button>
  }

  <div class="bs-size-selector__list" role="radiogroup" [attr.aria-label]="listLabel()">
    @for (item of visibleItems(); track item.id; let index = $index) {
      <div class="bs-size-selector__item">
        <button
          type="button"
          role="radio"
          class="bs-size"
          [class.bs-size--selected]="isEqual(item, selected())"
          [class.bs-size--disabled]="!isAvailable(item)"
          [disabled]="!isAvailable(item) || readonly() || loading()"
          [attr.aria-checked]="isEqual(item, selected())"
          [attr.aria-disabled]="!isAvailable(item)"
          [attr.aria-label]="ariaLabel(item)"
          [attr.tabindex]="isEqual(item, selected()) || index === 0 ? 0 : -1"
          (click)="onSelect(item)"
          (keydown)="onKeydown($event)"
        >
          {{ item.size }}
        </button>
        @if (isLowStock(item)) {
          <span class="bs-size-selector__low-stock" role="status">
            Plus que {{ item.stock }} en stock
          </span>
        }
      </div>
    }
  </div>

  @if (showMore()) {
    <button
      type="button"
      class="bs-size-selector__more"
      [disabled]="readonly() || loading()"
      (click)="toggleMore()"
    >
      {{ moreLabel() }}
    </button>
  }
</div>
