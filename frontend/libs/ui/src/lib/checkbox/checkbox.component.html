<div class="bs-choice" [class.bs-choice--error]="!!error" [class.bs-choice--disabled]="disabled">
  <label class="bs-choice__row" [attr.for]="fieldId">
    <input
      class="bs-choice__input"
      type="checkbox"
      [id]="fieldId"
      [name]="name"
      [checked]="checked"
      [indeterminate]="indeterminate"
      [disabled]="disabled"
      [attr.aria-invalid]="error ? 'true' : null"
      [attr.aria-describedby]="describedBy"
      (change)="onChange($event)"
    />
    <span class="bs-choice__box" aria-hidden="true">
      @if (indeterminate) {
        <span class="bs-choice__dash"></span>
      } @else if (checked) {
        <bruny-icon name="check" [size]="14" />
      }
    </span>
    <span class="bs-choice__label">{{ label }}</span>
  </label>

  @if (error) {
    <p class="bs-choice__message bs-choice__message--error" role="alert">{{ error }}</p>
  } @else if (hint) {
    <p class="bs-choice__message">{{ hint }}</p>
  }
</div>
