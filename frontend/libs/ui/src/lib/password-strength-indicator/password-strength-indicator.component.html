@if (password()) {
  <div class="pwd-strength" [attr.data-strength]="strength()">
    <div class="pwd-strength__bar" aria-hidden="true">
      @for (segment of segments; track segment) {
        <span class="pwd-strength__segment" [class.is-active]="segment <= level()"></span>
      }
    </div>
    <p class="pwd-strength__label" aria-live="polite" aria-atomic="true">Force : {{ label() }}</p>
    <ul class="pwd-strength__criteria" role="list">
      <li [class.is-ok]="criteria().minLength">
        <bruny-icon [name]="criteria().minLength ? 'check' : 'close'" [size]="14" />
        Au moins {{ minLength() }} caractères
      </li>
      <li [class.is-ok]="criteria().hasVariety">
        <bruny-icon [name]="criteria().hasVariety ? 'check' : 'close'" [size]="14" />
        Mélangez au moins deux catégories : minuscules, majuscules, chiffres, symboles
      </li>
      <li [class.is-ok]="criteria().notCommon">
        <bruny-icon [name]="criteria().notCommon ? 'check' : 'close'" [size]="14" />
        Pas un mot de passe courant
      </li>
    </ul>
  </div>
}
