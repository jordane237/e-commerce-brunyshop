# BRUNY SHOPPING — local development infrastructure
#
# Ports map to non-default host ports so this project can run alongside other
# Docker projects on the machine (see .env.example). Container-internal ports
# stay standard (5432, 6379, ...) so services communicate by service name.
#
# Only loopback addresses are published: the stack is never reachable from the
# local network. Services that need each other share a dedicated network.
#
# Usage:
#   cp .env.example .env   # then replace every CHANGE_ME value
#   docker compose up -d --wait   # PostgreSQL + Redis + Mailpit + MinIO
#   docker compose down           # stop (volumes preserved)
#   docker compose down -v        # stop and wipe data
#   docker compose --profile full up -d --wait   # also build/run the applications

name: bruny

# Shared hardening blocks: every service uses the same bounded logs and cannot
# gain new privileges at runtime.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-security: &default-security
  - no-new-privileges:true

services:
  postgres:
    image: postgres:18-alpine
    container_name: bruny-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requis dans .env}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      # PostgreSQL 18+: mount the parent directory; the cluster lives in
      # `${PG_VERSION}/docker` beside it. Postgres 17 and older use
      # /var/lib/postgresql/data instead.
      - postgres_data:/var/lib/postgresql
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-15432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
    security_opt: *default-security
    logging: *default-logging
    # Development only: the database is published on loopback for local code.
    # The production overlay removes this port; the API reaches it by name.

  redis:
    image: redis:8-alpine
    container_name: bruny-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '300', '1', '--loglevel', 'warning']
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-16379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend
    security_opt: *default-security
    logging: *default-logging
    # Development only: Redis is published on loopback for local code.

  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: bruny-mailpit
    restart: unless-stopped
    init: true
    environment:
      # Keep captured emails across container restarts.
      MP_DATABASE: /data/mailpit.db
      # Local development only: accept any SMTP credentials.
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - mailpit_data:/data
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8025/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mail
    security_opt: *default-security
    logging: *default-logging

  minio:
    # MinIO removed its community Docker Hub and Quay images in September 2026.
    # Silo is a maintained downstream build of the open-source MinIO server:
    # same API, console, health endpoint and MINIO_* configuration.
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    container_name: bruny-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requis dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requis dans .env}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-19000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - storage
    security_opt: *default-security
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Optional application stack: `docker compose --profile full up -d --wait`
  # ---------------------------------------------------------------------------
  api:
    profiles: [full]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: bruny-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET requis dans .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4200}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-http://localhost:4201}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:4201}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      MAIL_DRIVER: ${MAIL_DRIVER:-mailpit}
      MAIL_FROM: ${MAIL_FROM:-noreply@brunyshopping.example}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET:-brunyshop-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend, mail, storage, edge]
    security_opt: *default-security
    logging: *default-logging

  storefront:
    profiles: [full]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.storefront
    container_name: bruny-storefront
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      API_INTERNAL_URL: http://api:4000/api/v1
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4200}
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-localhost,127.0.0.1}
    expose: ['4000']
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/boutique').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [edge]
    security_opt: *default-security
    logging: *default-logging

  admin:
    profiles: [full]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.admin
    container_name: bruny-admin
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ADMIN_HOST_PORT:-4201}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [edge]
    security_opt: *default-security
    logging: *default-logging

  gateway:
    profiles: [full]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gateway
    container_name: bruny-gateway
    restart: unless-stopped
    ports:
      - '127.0.0.1:${STOREFRONT_HOST_PORT:-4200}:8080'
    depends_on:
      storefront:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [edge]
    security_opt: *default-security
    logging: *default-logging

networks:
  backend:
    # PostgreSQL and Redis only. The API joins it in the "full" profile.
  mail:
    # Mailpit only. The API joins it to send development emails.
  storage:
    # MinIO only. The API joins it to read/write product media.
  edge:
    # API, storefront, admin and gateway: HTTP traffic between applications.

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
  minio_data:
