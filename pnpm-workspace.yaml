packages:
  - frontend
  - backend

# Correctifs de sécurité des dépendances transitives (voir audit CI).
overrides:
  body-parser@^1.20.0: 1.20.9
  body-parser@^2.0.0: 2.4.0
  multer@^2.0.0: 2.5.0
  vite@^8.3.0: 8.3.3

# Trusted dependency build scripts (official tools only)
allowBuilds:
  nx: true
  esbuild: true
  '@swc/core': true
  '@scarf/scarf': false
  prisma: true
  '@prisma/engines': true
  '@prisma/client': true
  '@parcel/watcher': true
  lmdb: true
  msgpackr-extract: true
  bcrypt: true
